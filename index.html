<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Ivette</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>
    <header>
        <button id="btn-back" class="hidden">⬅ Volver</button>
        <h1 id="header-title">Inventario Ivette</h1>
        <button id="btn-scan" style="background: none; border: none; color: white; font-size: 1.5rem; padding: 0 5px; cursor:pointer;" title="Buscar / Escanear">🔍📷</button>
    </header>

    <!-- Contenedor del Buscador y Escáner -->
    <div id="reader-container" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 50px; padding-bottom: 20px; overflow-y: auto;">
        <button id="btn-close-scanner" style="position:absolute; top:10px; right:10px; background: #f44336; color:white; border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer;">Cerrar X</button>
        
        <div id="reader" style="width: 100%; max-width: 500px; background: white; margin-bottom: 15px;"></div>
        
        <!-- Búsqueda Manual de CÓDIGO -->
        <p style="color: #aaa; margin-bottom: 5px; font-size: 0.9rem; text-align: center; text-transform: uppercase; font-weight: bold;">Búsqueda por Código Numérico</p>
        <div style="display: flex; gap: 10px; width: 90%; max-width: 400px; margin-bottom: 20px;">
            <input type="number" id="manual-barcode-input" inputmode="numeric" placeholder="Ej: 7790170..." style="flex-grow: 1; padding: 10px; font-size: 1.1rem; border-radius: 5px; border: none; text-align: center;">
            <button id="btn-manual-search" style="background: #4CAF50; color: white; border: none; padding: 10px 15px; font-size: 1.1rem; border-radius: 5px; font-weight: bold; cursor: pointer;">Buscar</button>
        </div>

        <!-- Búsqueda Manual de NOMBRE (Texto o Voz) -->
        <p style="color: #aaa; margin-bottom: 5px; font-size: 0.9rem; text-align: center; text-transform: uppercase; font-weight: bold;">Búsqueda por Nombre</p>
        <div style="display: flex; gap: 5px; width: 90%; max-width: 400px; margin-bottom: 15px;">
            <button id="btn-dictate" style="background: #2196F3; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 1.2rem; cursor: pointer;" title="Dictar por voz">🎤</button>
            <input type="text" id="manual-name-input" placeholder="Escribe o dicta el nombre..." style="flex-grow: 1; padding: 10px; font-size: 1.1rem; border-radius: 5px; border: none; text-align: center;">
            <button id="btn-name-search" style="background: #4CAF50; color: white; border: none; padding: 10px 15px; font-size: 1.1rem; border-radius: 5px; font-weight: bold; cursor: pointer;">Buscar</button>
        </div>
    </div>

    <main id="app-content">
        <div id="loading" class="text-center">Cargando inventario...</div>
    </main>

    <!-- Librería para el lector de código de barras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registrado');
                }).catch(err => {
                    console.warn('Error al registrar Service Worker', err);
                });
            });
        }
    </script>
</body>
</html>
