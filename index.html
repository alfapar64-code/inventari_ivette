<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Ivette</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>
    <header>
        <button id="btn-back" class="hidden">⬅ Volver</button>
        <h1 id="header-title">Inventario Ivette</h1>
        <button id="btn-scan" style="background: none; border: none; color: white; font-size: 1.5rem; padding: 0 5px; cursor:pointer;" title="Escanear Código">📷</button>
    </header>

    <!-- Contenedor de la cámara oculta por defecto -->
    <div id="reader-container" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <button id="btn-close-scanner" style="position:absolute; top:20px; right:20px; background: #f44336; color:white; border:none; padding:10px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Cerrar X</button>
        <div id="reader" style="width: 100%; max-width: 500px; background: white;"></div>
    </div>

    <main id="app-content">
        <div id="loading" class="text-center">Cargando inventario...</div>
    </main>

    <!-- Librería para el lector de código de barras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registrado');
                }).catch(err => {
                    console.warn('Error al registrar Service Worker', err);
                });
            });
        }
    </script>
</body>
</html>
